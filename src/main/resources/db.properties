# ============================================================================
# FISCAL — Custom Tax Management System
# Database Configuration Properties
# ============================================================================

# Oracle Database JDBC Driver
db.driver=oracle.jdbc.OracleDriver

# Oracle Connection URL (Standard Oracle Express Edition XE, Free 23c, or Enterprise ORCL)
# Example XE: jdbc:oracle:thin:@localhost:1521:XE
# Example 23c Free: jdbc:oracle:thin:@localhost:1521:FREE
# Example PDB: jdbc:oracle:thin:@localhost:1521/XEPDB1
db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1

# Oracle Database Credentials (Can also be overridden via ORACLE_USER / ORACLE_PASSWORD env vars)
db.user=system
db.password=Oracle123

# Connection Pool / Timeout Settings
db.initialSize=5
db.maxTotal=20
db.maxWaitMillis=5000
db.testOnBorrow=true
db.validationQuery=SELECT 1 FROM DUAL

# Development Fallback Mode:
# When true, if Oracle DB is temporarily unreachable during local dev / offline demo,
# the system automatically activates the compliant In-Memory Transaction Engine seeded with 03_seed_data.sql.
# When Oracle is reachable, real Oracle JDBC transactions are always used.
db.allowFallback=false
