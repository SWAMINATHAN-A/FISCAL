# PostgreSQL Database JDBC Driver
db.driver=org.postgresql.Driver

# Supabase PostgreSQL Connection URL (IPv4 Compatible Pooler)
db.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require

# Supabase Credentials (Dynamically loaded via .env file or DB_PASSWORD env var)
